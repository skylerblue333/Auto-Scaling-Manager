name: scaling-policy-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Build image
        run: docker build -t sky-scaling-policy:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-scaling-policy:ci -u)" != "0"
      - name: Smoke test health
        run: |
          docker run -d --rm --name sky-scaling-ci -p 18081:8080 sky-scaling-policy:ci
          trap 'docker stop sky-scaling-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs sky-scaling-ci
          exit 1
